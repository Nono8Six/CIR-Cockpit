name: QA

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  qa:
    name: Full QA Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.5.6

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.json', 'backend/deno.json', 'backend/deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: Prepare backend env file
        run: |
          if [ ! -f backend/.env ]; then
            cp backend/.env.example backend/.env
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install repository check tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Run CI QA gate
        run: pnpm run qa:ci
